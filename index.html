<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesas · M&D</title><link rel="stylesheet" href="style.css"><meta name="theme-color" content="#FCFAF7"></head><body>
<header class="frame"><svg class="corner tl" viewBox="0 0 60 60"><use href="#flour"/></svg><svg class="corner tr" viewBox="0 0 60 60"><use href="#flour"/></svg>
<svg width="0" height="0" style="position:absolute"><defs><g id="flour" fill="none" stroke="#706E3F" stroke-width="2" stroke-linecap="round"><path d="M4 56V20Q4 4 20 4h36"/><path d="M12 48c0-14 4-22 14-24s14 6 8 10-10-2-6-6"/><path d="M48 12c-14 0-22 4-24 14"/><circle cx="20" cy="20" r="3" fill="#706E3F"/><path d="M8 30q6 2 8 8M30 8q2 6 8 8"/></g></defs></svg>
<svg class="mono" viewBox="0 0 200 150" aria-label="Monograma MD">
<g fill="none" stroke="#706E3F" stroke-width="1.6" stroke-linecap="round">
<path d="M40 70Q50 120 100 138Q150 120 160 70"/>
<g id="lv"><ellipse cx="44" cy="84" rx="7" ry="3" transform="rotate(-60 44 84)"/><ellipse cx="52" cy="102" rx="7" ry="3" transform="rotate(-40 52 102)"/><ellipse cx="64" cy="116" rx="7" ry="3" transform="rotate(-20 64 116)"/><ellipse cx="80" cy="128" rx="7" ry="3" transform="rotate(-5 80 128)"/><ellipse cx="38" cy="96" rx="6" ry="2.5" transform="rotate(-100 38 96)"/><ellipse cx="50" cy="118" rx="6" ry="2.5" transform="rotate(-70 50 118)"/></g>
<use href="#lv" transform="translate(200 0) scale(-1 1)"/></g>
<text x="100" y="98" text-anchor="middle" font-family="'Cormorant Garamond','Didot','Bodoni 72',Georgia,serif" font-size="78" fill="#706E3F" letter-spacing="-14">MD</text></svg>
<h1>Mapa de Mesas</h1><p class="sub" id="stats"></p></header>
<nav class="bar">
<label class="btn">📄 Importar lista<input type="file" id="file" accept=".txt,.csv,.text,text/plain" hidden></label>
<button class="btn" id="pasteBtn">✍️ Colar nomes</button>
<button class="btn" id="addTable">＋ Mesa</button>
<button class="btn" id="exportBtn">⬇️ Exportar</button>
<label class="btn">⬆️ Restaurar<input type="file" id="importJson" accept=".json" hidden></label>
<button class="btn ghost" id="resetBtn">Recomeçar</button>
</nav>
<div id="hint" class="hint" hidden></div>
<main class="board">
<section class="col pool frame2" id="pool"><h2>Sem mesa <span id="poolCount"></span></h2>
<input id="search" type="search" placeholder="Buscar convidado…"><input id="newGuest" placeholder="＋ Adicionar convidado (Enter)">
<ul id="poolList" class="guests"></ul></section>
<div id="tables" class="tables"></div></main>
<dialog id="pasteDlg"><form method="dialog"><h3>Colar convidados</h3><p>Um nome por linha</p><textarea id="pasteTxt" rows="10"></textarea><div class="row"><button value="cancel" class="btn ghost">Cancelar</button><button value="ok" class="btn">Adicionar</button></div></form></dialog>
<dialog id="exportDlg"><form method="dialog"><h3>Exportar</h3><div class="col2"><button type="button" class="btn" data-x="txt">Mapa (.txt)</button><button type="button" class="btn" data-x="csv">Planilha (.csv)</button><button type="button" class="btn" data-x="json">Backup (.json)</button><button type="button" class="btn" data-x="print">Imprimir / PDF</button><button class="btn ghost">Fechar</button></div></form></dialog>
<script src="app.js"></script></body></html>
